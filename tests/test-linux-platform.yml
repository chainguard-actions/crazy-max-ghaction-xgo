name: Test Linux platform check
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go package for compilation
        run: |
          mkdir -p /tmp/platformapp
          cat > /tmp/platformapp/main.go << 'GOEOF'
          package main
          import "fmt"
          func main() { fmt.Println("Platform test!") }
          GOEOF
          printf 'module example.com/platformapp\n\ngo 1.21\n' > /tmp/platformapp/go.mod
          echo "Go app created at /tmp/platformapp"
          ls -la /tmp/platformapp

      - id: action
        uses: .
        continue-on-error: true
        with:
          xgo_version: 'latest'
          targets: 'linux/amd64'
          dest: 'build'
          working_dir: '/tmp/platformapp'

      - name: Assert action did not fail with platform error (we are on Linux)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # On Linux (ubuntu-latest), the action should NOT fail with "Only supported on linux platform"
          # It may fail later due to Docker not being available for xgo, but that's acceptable
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME' (platform check passed on Linux)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
