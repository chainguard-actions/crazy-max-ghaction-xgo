name: Test pkg, tags, and buildvcs inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go package with sub-package for compilation
        run: |
          mkdir -p /tmp/multiapp/cmd/server
          cat > /tmp/multiapp/cmd/server/main.go << 'GOEOF'
          package main
          import "fmt"
          func main() { fmt.Println("Hello from server!") }
          GOEOF
          printf 'module example.com/multiapp\n\ngo 1.21\n' > /tmp/multiapp/go.mod
          echo "Go app created at /tmp/multiapp"
          ls -la /tmp/multiapp/cmd/server

      - id: action
        uses: .
        continue-on-error: true
        with:
          xgo_version: 'latest'
          go_version: 'latest'
          targets: 'linux/amd64'
          dest: 'build'
          pkg: 'cmd/server'
          tags: 'netgo,osusergo'
          buildvcs: 'false'
          working_dir: '/tmp/multiapp'

      - name: Assert action ran with pkg/tags/buildvcs inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
