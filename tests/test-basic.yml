name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          xgo_version: 'latest'
          go_version: '1.21'
          dest: 'build'
          targets: 'linux/amd64'
          v: 'false'
          x: 'false'
          race: 'false'
          trimpath: 'false'
          buildmode: 'default'
      - name: Assert build directory exists
        run: |
          echo "Checking build directory was created"
          if [ ! -d "build" ]; then
            echo "FAIL: build directory not found"
            exit 1
          fi
          echo "PASS: build directory exists"
          ls -la build/
