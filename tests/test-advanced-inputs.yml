name: Test advanced inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create Go source for cross-compilation
        run: |
          mkdir -p /tmp/myapp
          cat > /tmp/myapp/main.go << 'EOF'
          package main

          import "fmt"

          func main() {
              fmt.Println("Hello, xgo!")
          }
          EOF
          cat > /tmp/myapp/go.mod << 'EOF'
          module example.com/myapp

          go 1.21
          EOF
      - id: action
        uses: .
        with:
          xgo_version: 'latest'
          go_version: '1.21'
          dest: '/tmp/myapp/build'
          targets: 'linux/amd64'
          v: 'false'
          x: 'false'
          race: 'false'
          trimpath: 'false'
          buildmode: 'default'
          buildvcs: 'false'
          ldflags: '-s -w'
          pkg: ''
          prefix: 'myapp'
          tags: ''
          working_dir: '/tmp/myapp'
      - name: Assert build directory exists
        run: |
          echo "Checking build directory was created"
          if [ ! -d "/tmp/myapp/build" ]; then
            echo "FAIL: build directory not found"
            exit 1
          fi
          echo "PASS: build directory exists"
          ls -la /tmp/myapp/build/
