name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Go package for compilation
        run: |
          mkdir -p /tmp/myapp
          cat > /tmp/myapp/main.go << 'GOEOF'
          package main
          import "fmt"
          func main() { fmt.Println("Hello from myapp!") }
          GOEOF
          printf 'module example.com/myapp\n\ngo 1.21\n' > /tmp/myapp/go.mod
          echo "Go app created at /tmp/myapp"
          ls -la /tmp/myapp

      - id: action
        uses: .
        continue-on-error: true
        with:
          xgo_version: 'latest'
          go_version: '1.21'
          targets: 'linux/amd64'
          dest: 'dist'
          prefix: 'myapp'
          v: 'true'
          x: 'false'
          race: 'false'
          ldflags: '-s -w'
          buildmode: 'default'
          trimpath: 'true'
          working_dir: '/tmp/myapp'

      - name: Assert action ran with custom inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome '$OUTCOME'"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
