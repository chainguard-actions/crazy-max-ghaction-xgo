name: Test verbose and debug flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker to intercept xgo Docker calls
        run: |
          mkdir -p "$HOME/fake-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" "$HOME/fake-bin/docker"
          chmod +x "$HOME/fake-bin/docker"
          echo "$HOME/fake-bin" >> "$GITHUB_PATH"

      - name: Create build-verbose directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/hello/build-verbose"

      - name: Run xgo with verbose and x flags
        id: action
        uses: .
        with:
          xgo_version: latest
          go_version: '1.21'
          targets: 'linux/amd64'
          working_dir: '${{ github.workspace }}/tests/fixtures/hello'
          dest: 'build-verbose'
          v: 'true'
          x: 'true'

      - name: Assert binary was produced with verbose flags
        run: |
          echo "Listing build-verbose directory:"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/hello/build-verbose/" || true
          count=$(find "$GITHUB_WORKSPACE/tests/fixtures/hello/build-verbose" -type f | wc -l)
          echo "Binary count: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: No binaries found in build-verbose directory"
            exit 1
          fi
          echo "PASS: Found $count binary/binaries with verbose flags"
