name: Test custom destination folder
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install fake docker to intercept xgo Docker calls
        run: |
          mkdir -p "$HOME/fake-bin"
          cp "$GITHUB_WORKSPACE/tests/fixtures/fake-docker.sh" "$HOME/fake-bin/docker"
          chmod +x "$HOME/fake-bin/docker"
          echo "$HOME/fake-bin" >> "$GITHUB_PATH"

      - name: Create output directory
        run: mkdir -p "$GITHUB_WORKSPACE/tests/fixtures/hello/output"

      - name: Run xgo with custom destination
        id: action
        uses: .
        with:
          xgo_version: latest
          go_version: '1.21'
          targets: 'linux/amd64'
          working_dir: '${{ github.workspace }}/tests/fixtures/hello'
          dest: 'output'

      - name: Assert binary was produced in custom dest
        run: |
          echo "Listing custom output directory:"
          ls -la "$GITHUB_WORKSPACE/tests/fixtures/hello/output/" || true
          count=$(find "$GITHUB_WORKSPACE/tests/fixtures/hello/output" -type f | wc -l)
          echo "Binary count: $count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: No binaries found in custom output directory"
            exit 1
          fi
          echo "PASS: Found $count binary/binaries in custom dest"
